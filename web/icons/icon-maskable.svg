<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable icon: content within safe zone (center 80% = 409px area) -->
  <!-- Full background fill — no rounded corners for maskable -->
  <rect width="512" height="512" fill="#4361ee"/>
  
  <!-- 3x3 grid lines (white) — scaled to fit within maskable safe zone -->
  <rect x="120" y="120" width="272" height="272" rx="12" fill="none" stroke="#ffffff" stroke-width="10"/>
  
  <!-- Vertical dividers -->
  <line x1="210" y1="120" x2="210" y2="392" stroke="#ffffff" stroke-width="5" opacity="0.5"/>
  <line x1="302" y1="120" x2="302" y2="392" stroke="#ffffff" stroke-width="5" opacity="0.5"/>
  
  <!-- Horizontal dividers -->
  <line x1="120" y1="210" x2="392" y2="210" stroke="#ffffff" stroke-width="5" opacity="0.5"/>
  <line x1="120" y1="302" x2="392" y2="302" stroke="#ffffff" stroke-width="5" opacity="0.5"/>
  
  <!-- Center digit "9" — within safe zone -->
  <text x="256" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="140" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">9</text>
</svg>
